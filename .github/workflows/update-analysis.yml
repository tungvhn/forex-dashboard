name: Update Technical Analysis

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run analysis script
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: python technical/generate_analysis.py

      - name: Commit and push analysis.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add technical/analysis.json
          git diff --staged --quiet || git commit -m "chore: update technical analysis $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
